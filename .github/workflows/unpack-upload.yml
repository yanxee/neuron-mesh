name: Unpack source archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source and commit
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("neuron-mesh-source-0.2.0.zip") as archive:
              archive.extractall(".")
          PY
          rm -f neuron-mesh-source-0.2.0.zip
          rm -f .github/workflows/unpack-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add neuron-mesh v0.2.0 source"
          git push
