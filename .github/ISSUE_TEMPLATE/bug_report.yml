name: Bug report
description: Report a reproducible NeuronMesh defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Commands, configuration and relevant non-secret logs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

