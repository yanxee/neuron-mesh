[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neuron-mesh"
version = "0.2.0"
description = "Research-grade invite-only decentralized inference and persistent memory mesh"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yanxee" }]
keywords = [
  "decentralized-ai",
  "distributed-inference",
  "federated-learning",
  "large-language-models",
  "llm",
  "long-term-memory",
  "peer-to-peer",
  "persistent-memory",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
neuron-mesh = "neuron_mesh.__main__:main"

[project.urls]
Homepage = "https://yanxee.github.io/neuron-mesh/"
Repository = "https://github.com/yanxee/neuron-mesh"
Issues = "https://github.com/yanxee/neuron-mesh/issues"
Documentation = "https://yanxee.github.io/neuron-mesh/"

[tool.hatch.build.targets.wheel]
packages = ["neuron_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

